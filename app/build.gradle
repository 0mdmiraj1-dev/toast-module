plugins {
    id 'com.android.application'
}

android {
    namespace 'com.s9encryptor.strongtoastextended'
    compileSdk 35

    defaultConfig {
        applicationId 'com.s9encryptor.strongtoastextended'
        minSdk 26
        targetSdk 28
        versionCode 6
        versionName '0.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // This legacy LSPosed module is installed directly, outside Google Play.
        // Keep the original target SDK and report Play's target rule as a warning.
        warning 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
